<div class="grid grid-cols-5 gap-2 w-full max-w-md mx-auto aspect-square">
    {% for square in session.board %}
    {% set is_winning = square.id in session.winning_square_ids %}
    <button
        {% if not square.is_free_space %}
        hx-post="/toggle/{{ square.id }}"
        hx-target="#game-container"
        hx-swap="outerHTML"
        {% endif %}
        {% if square.is_free_space %}disabled{% endif %}
        class="relative flex items-center justify-center p-2 text-center border rounded-lg transition-all duration-300 select-none min-h-[60px] text-xs leading-tight font-source-serif hover:scale-105
        {%- if square.is_marked %}
            {%- if is_winning %} bg-cinematic-blood/90 border-cinematic-blood text-cinematic-darker glow-blood shadow-cinematic spotlight
            {%- else %} bg-cinematic-cyan/20 border-cinematic-cyan text-cinematic-cyan shadow-cinematic
            {%- endif %}
        {%- else %} bg-cinematic-darker/50 border-cinematic-secondary/50 text-cinematic-primary hover:bg-cinematic-darker/70 hover:border-cinematic-gold/50
        {%- endif %}
        {%- if square.is_free_space %} font-orbitron font-bold text-sm bg-cinematic-gold/20 border-cinematic-gold text-cinematic-gold animate-glow-pulse{% endif %}"
        aria-pressed="{{ 'true' if square.is_marked else 'false' }}"
        aria-label="{{ 'Free space' if square.is_free_space else square.text }}">
        <span class="wrap-break-word hyphens-auto">{{ square.text }}</span>
        {% if square.is_marked and not square.is_free_space %}
        <span class="absolute top-0.5 right-0.5 text-cinematic-gold text-lg glow-gold">✓</span>
        {% endif %}
    </button>
    {% endfor %}
</div>
