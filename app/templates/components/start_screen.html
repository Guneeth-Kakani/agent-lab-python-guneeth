<div id="game-container" class="animate-dramatic-fade-in">
<div class="flex flex-col items-center justify-center min-h-full p-6 bg-cinematic-theater relative overflow-hidden">
    <!-- Background gradient overlay -->
    <div class="absolute inset-0 bg-gradient-to-br from-cinematic-purple/20 via-transparent to-cinematic-red/20"></div>

    <!-- Curtain effect -->
    <div class="absolute inset-0 bg-cinematic-blood animate-curtain-open" style="transform-origin: top;"></div>
    <div class="absolute inset-0 bg-cinematic-blood animate-curtain-open" style="transform-origin: bottom; animation-delay: 0.1s;"></div>

    <!-- Spotlight effects -->
    <div class="absolute top-10 left-10 w-32 h-32 bg-cinematic-gold rounded-full opacity-20 blur-xl animate-spotlight-sweep"></div>
    <div class="absolute bottom-20 right-20 w-24 h-24 bg-cinematic-cyan rounded-full opacity-15 blur-lg animate-spotlight-sweep" style="animation-delay: 1s;"></div>

    <div class="text-center max-w-sm relative z-10">
        <h1 class="text-6xl font-cinzel font-bold text-cinematic-gold mb-2 text-shadow-cinematic animate-dramatic-fade-in" style="animation-delay: 0.5s">Soc Ops</h1>
        <p class="text-xl font-orbitron text-cinematic-secondary mb-8 animate-dramatic-fade-in" style="animation-delay: 0.7s">Social Bingo</p>

        <div class="bg-cinematic-darker/90 backdrop-blur-sm rounded-xl p-6 shadow-cinematic border border-cinematic-gold/30 mb-8 animate-dramatic-fade-in" style="animation-delay: 0.9s">
            <h2 class="font-cinzel font-semibold text-cinematic-gold mb-3">How to play</h2>
            <ul class="text-left text-cinematic-primary text-sm space-y-2 font-source-serif">
                <li>• Find people who match the questions</li>
                <li>• Tap a square when you find a match</li>
                <li>• Get 5 in a row to win!</li>
            </ul>
        </div>

        <button
            hx-post="/start"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="w-full bg-cinematic-blood text-cinematic-primary font-orbitron font-semibold py-4 px-8 rounded-lg text-lg glow-blood hover:scale-105 transition-all duration-300 animate-dramatic-fade-in animate-shimmer" style="animation-delay: 1.1s">
            Start Game
        </button>
    </div>
</div>
</div>
