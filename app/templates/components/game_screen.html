<div id="game-container" class="animate-dramatic-fade-in">
<div class="flex flex-col min-h-full bg-cinematic-theater relative overflow-hidden">
    <!-- Spotlight effects -->
    <div class="absolute top-0 left-1/4 w-40 h-40 bg-cinematic-gold rounded-full opacity-10 blur-2xl animate-spotlight-sweep"></div>
    <div class="absolute bottom-0 right-1/4 w-32 h-32 bg-cinematic-cyan rounded-full opacity-8 blur-xl animate-spotlight-sweep" style="animation-delay: 2s;"></div>
    <!-- Header -->
    <header class="flex items-center justify-between p-3 bg-cinematic-darker/95 backdrop-blur-sm border-b border-cinematic-blood/30 shadow-cinematic relative z-10">
        <button
            hx-post="/reset"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="text-cinematic-secondary text-sm px-3 py-1.5 rounded border border-cinematic-cyan/50 hover:bg-cinematic-cyan/20 hover:text-cinematic-cyan transition-all duration-300 font-orbitron">
            ← Back
        </button>
        <h1 class="font-cinzel font-bold text-cinematic-gold text-shadow-cinematic">Soc Ops</h1>
        <div class="w-16"></div>
    </header>

    <!-- Instructions -->
    <p class="text-center text-cinematic-muted text-sm py-2 px-4 font-source-serif">
        Tap a square when you find someone who matches it.
    </p>

    <!-- Bingo indicator -->
    {% if session.has_bingo %}
    <div class="bg-cinematic-blood/30 text-cinematic-blood text-center py-2 font-orbitron font-semibold text-sm border-y border-cinematic-blood/50 animate-glow-pulse spotlight">
        🎭 BINGO! You got a line!
    </div>
    {% endif %}

    <!-- Board -->
    <div class="flex-1 flex items-center justify-center p-3">
        {% include "components/bingo_board.html" %}
    </div>
</div>

{% if session.show_bingo_modal %}
    {% include "components/bingo_modal.html" %}
{% endif %}
</div>
